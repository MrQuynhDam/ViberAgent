name: Build Viber RF Agent EXE

on:
  push:
    branches: [ "**" ] # Chạy tự động mỗi khi push commit lên bất kỳ branch nào
  pull_request:
    branches: [ "**" ]
  workflow_dispatch: # Kích hoạt chạy thủ công từ giao diện GitHub nếu cần

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "ViberRFAgent" viber_rf_agent_gui.py

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViberRFAgent-Windows-App
          path: dist/ViberRFAgent/
